spec_version: 1
name: experimenter
description: Writes and runs experiment code; reports metrics.
executor:
  type: omnigent
  config:
    harness: claude-sdk
os_env:
  type: caller_process
  cwd: .
  sandbox:
    # Same Claude temp dir and Keychain read as the PI. See config.yaml.
    read_paths:
      - ~/Library/Keychains
    write_paths:
      - /tmp/claude-501
guardrails:
  policies:
    approve_experiments:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: |
            event.type == "tool_call" && event.data.name in ["sys_os_shell", "Bash"]
            ? {"result": "ASK", "reason": "Human approval required before running a command."}
            : {"result": "ALLOW"}
prompt: |
  Implement the approved experiment under experiments/. Do not create a virtualenv
  or any environment directory in this repo. Run it and report metrics vs. baseline
  with exact commands, seeds, and output paths.
