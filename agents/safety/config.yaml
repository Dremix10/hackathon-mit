spec_version: 1
name: safety
description: Policy gate. Asks a human before a real-API batch over the cost threshold.
executor:
  type: omnigent
  config:
    harness: claude-sdk
    instructions: safety.md
os_env:
  type: caller_process
  cwd: .
  sandbox:
    read_paths:
      - ~/Library/Keychains
    write_paths:
      - /tmp/claude-501
guardrails:
  policies:
    hide_sealed:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: |
            event.type == "tool_call"
            && (
              (has(event.data.arguments.path) && event.data.arguments.path.contains("sealed.json"))
              || (has(event.data.arguments.file_path) && event.data.arguments.file_path.contains("sealed.json"))
              || (has(event.data.arguments.command) && event.data.arguments.command.contains("sealed.json"))
            )
            ? {"result": "DENY", "reason": "sealed.json is withheld from agents and default analysis."}
            : {"result": "ALLOW"}
    no_shell_or_write:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: |
            event.type == "tool_call" && event.data.name in [
              "sys_os_shell", "sys_os_write", "sys_os_edit",
              "Bash", "bash", "shell", "Shell", "terminal",
              "Write", "Edit", "MultiEdit", "NotebookEdit",
              "execute_code"
            ]
            ? {"result": "DENY", "reason": "Safety reviews the estimate and does not run commands or write files."}
            : {"result": "ALLOW"}
    read_scope:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: |
            event.type == "tool_call" && event.data.name == "sys_os_read"
            ? (
              has(event.data.arguments.path)
              && !event.data.arguments.path.contains("..")
              && (
                event.data.arguments.path == "research"
                || event.data.arguments.path.startsWith("research/")
                || event.data.arguments.path.startsWith("./research/")
                || event.data.arguments.path == "runs"
                || event.data.arguments.path.startsWith("runs/")
                || event.data.arguments.path.startsWith("./runs/")
                || event.data.arguments.path == "experiments"
                || event.data.arguments.path.startsWith("experiments/")
                || event.data.arguments.path.startsWith("./experiments/")
              )
              ? {"result": "ALLOW"}
              : {"result": "DENY", "reason": "Safety may only read research/, runs/, and experiments/."}
            )
            : {"result": "ALLOW"}
