spec_version: 1
name: analyst
description: Reads run events and calls the analysis package. Does not spend API credits.
executor:
  type: omnigent
  config:
    harness: claude-sdk
    instructions: analyst.md
os_env:
  type: caller_process
  cwd: .
  sandbox:
    read_paths:
      - ~/Library/Keychains
    write_paths:
      - /tmp/claude-501
guardrails:
  policies:
    hide_sealed:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: |
            event.type == "tool_call"
            && (
              (has(event.data.arguments.path) && event.data.arguments.path.contains("sealed.json"))
              || (has(event.data.arguments.file_path) && event.data.arguments.file_path.contains("sealed.json"))
              || (has(event.data.arguments.command) && event.data.arguments.command.contains("sealed.json"))
            )
            ? {"result": "DENY", "reason": "sealed.json is withheld from agents and default analysis."}
            : {"result": "ALLOW"}
    no_real_api_batch:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: |
            event.type == "tool_call" && event.data.name in [
              "sys_os_shell", "Bash", "bash", "shell", "Shell", "terminal"
            ]
            && has(event.data.arguments.command)
            && (
              event.data.arguments.command.contains("--execute")
              || event.data.arguments.command.contains("--human-approved")
              || event.data.arguments.command.contains("anthropic")
            )
            ? {"result": "DENY", "reason": "Analyst cannot start a real-API batch."}
            : {"result": "ALLOW"}
