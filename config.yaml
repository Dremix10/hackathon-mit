# Lab orchestrator ("PI"). The bundle root is the repo root.
# First check, from this directory: omnigent run . -p "Say hello"
spec_version: 1
name: pi
description: Principal-investigator orchestrator for the cooperative-recruitment study.
executor:
  type: omnigent
  config:
    harness: claude-sdk
    instructions: pi.md
os_env:
  type: caller_process
  cwd: .
  sandbox:
    # Claude CLI opens /tmp/claude-<uid> (this Mac: uid 501). Omnigent's
    # seatbelt grant uses $TMPDIR/claude-<uid>, which is /var/folders/.../T
    # on macOS, so the open comes back EPERM. /tmp is a symlink; the
    # resolved grant is /private/tmp/claude-501.
    # Login lives in the macOS Keychain (Claude Code-credentials), not in
    # ~/.claude/.credentials.json. Without this read, the sandboxed CLI
    # reports "Not logged in" even when `claude auth status` outside says yes.
    read_paths:
      - ~/Library/Keychains
    write_paths:
      - /tmp/claude-501
guardrails:                      # in a spec_version bundle, policies MUST live here (top-level `policies:` is ignored)
  policies:
    hide_sealed:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: |
            event.type == "tool_call"
            && (
              (has(event.data.arguments.path) && event.data.arguments.path.contains("sealed.json"))
              || (has(event.data.arguments.file_path) && event.data.arguments.file_path.contains("sealed.json"))
              || (has(event.data.arguments.command) && event.data.arguments.command.contains("sealed.json"))
            )
            ? {"result": "DENY", "reason": "sealed.json is withheld from agents and default analysis."}
            : {"result": "ALLOW"}
    budget:
      type: function
      function:
        path: omnigent.policies.builtins.cost.cost_budget
        arguments:
          max_cost_usd: 20.0
          ask_thresholds_usd: [10.0]
    cap_calls:
      type: function
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 300
    approve_real_api_over_threshold:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: |
            event.type == "tool_call" && event.data.name in [
              "sys_os_shell", "Bash", "bash", "shell", "Shell", "terminal"
            ]
            && has(event.data.arguments.command)
            && event.data.arguments.command.contains("--human-approved")
            ? {"result": "ASK", "reason": "Real-API batch is over the cost threshold. Human approval required before this command runs."}
            : {"result": "ALLOW"}
tools:
  agents: [planner, literature, experimenter, analyst, safety, critic]
